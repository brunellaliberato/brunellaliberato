<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1400px;height:900px;background:#0E0B1A;color:#fff;font:15px/1.4 -apple-system,Inter,Arial,sans-serif;padding:36px 44px;box-sizing:border-box}

.row .c{padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.row img.big{height:64px}.sm{display:flex;gap:16px;align-items:end}
